[package]
name = "otel-token-meter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local, privacy-first OTLP token and latency accounting"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-otel-token-meter"
keywords = ["opentelemetry", "otlp", "llm", "tokens", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["dist/", "site/", ".factory/"]

[[bin]]
name = "otel-token-meter"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.5.47", features = ["derive"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "0.14.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
tempfile = "3.21.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

